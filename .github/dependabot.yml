# Weekly dependency update PRs (minor/patch only). Each PR runs the full CI pipeline before it can be merged.
# Runner image: workflows pin ubuntu-24.04 so GitHub's ubuntu-latest migrations can't change the build unannounced.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (e.g. Prisma 7, TypeScript 7) need code changes: upgrade deliberately, not via bot PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (e.g. Prisma 7, TypeScript 7) need code changes: upgrade deliberately, not via bot PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Node major versions are upgraded deliberately (LTS only, after testing), not automatically.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
